name: Sync skills

# Copies the latest main of both skill repos into skills/, runs every test and
# opens (or updates) one pull request on the branch sync/skills when something
# changed. Two jobs, so the skills' own code never runs next to a write token:
#   test     read-only token: copies, commits locally, checks, runs every test
#   publish  write token: copies the same commits again (kit code only, no skill
#            code, no pip), checks, pushes sync/skills and opens or updates the PR
# When the two new versions fail together, each skill is tried alone and the one that
# passes is still synced. If anything fails, a third job opens an issue "Sync skills
# failed"; the next fully green run closes it.
#
# CI on a pull request pushed with the workflow token waits for approval: open the
# pull request, then "Approve workflows to run" (or close and reopen it). The same
# tests already ran here on Ubuntu; that CI adds macOS and the other Python versions.
#
# Run it by hand after a skill update (Actions tab, "Sync skills", "Run workflow")
# or wait for the nightly run. GitHub turns scheduled workflows off after 60 days
# without activity in a public repo: `gh workflow enable sync.yml` turns it back on.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash   # -eo pipefail: a failing command in a pipe fails the step

concurrency:
  group: sync-skills
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      partial: ${{ steps.sync.outputs.partial }}
      sources: ${{ steps.sync.outputs.sources }}
      log: ${{ steps.sync.outputs.log }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Copy the latest skills, test them, and keep what passes
        id: sync
        run: |
          run_tests() {
            python3 -m pip install -q "--only-binary=:all:" -r skills/3d-print-design/requirements.txt &&
            (cd skills/3d-print-design && python3 -m unittest discover -s tests -q) &&
            (cd skills/x2d-print && python3 -m unittest discover -s tests -q) &&
            python3 -m unittest discover -s tests -v
          }
          commit_and_check() {     # commit locally, then check from a clean tree
            git add skills && git commit -q -m "$1" && git clean -xdfq -- skills &&
            python3 scripts/sync_skills.py --check
          }
          drop_last() { git reset -q --hard HEAD~1 && git clean -xdfq -- skills; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/sync_skills.py | tee sync.log
          partial=false
          if git diff --quiet -- skills && [ -z "$(git ls-files --others --exclude-standard -- skills)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            commit_and_check "Sync skills"
            if ! run_tests; then
              # one skill may have broken the other or the hand-off: try each alone, keep what passes
              echo "::warning::the two new skill versions fail together; trying each one alone"
              drop_last
              : > sync.log
              kept=""
              for s in 3d-print-design x2d-print; do
                python3 scripts/sync_skills.py --only "$s" | tee -a sync.log
                if git diff --quiet -- skills && [ -z "$(git ls-files --others --exclude-standard -- skills)" ]; then
                  continue
                fi
                commit_and_check "Sync $s"
                if run_tests; then kept="$kept $s"; else echo "::error::$s fails its tests: not synced"; drop_last; fi
              done
              [ -n "$kept" ] || exit 1
              partial=true
              echo "only$kept synced; the other skill failed its tests (see the issue)" | tee -a sync.log
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "partial=$partial" >> "$GITHUB_OUTPUT"
          echo "sources=$(python3 -c 'import json; print(json.dumps(json.load(open("skills/SOURCES.json"))))')" >> "$GITHUB_OUTPUT"
          echo "log=$(tr '\n' ' ' < sync.log | cut -c1-500)" >> "$GITHUB_OUTPUT"

  publish:
    needs: test
    if: needs.test.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Copy the tested commits again (kit code only)
        env:
          SOURCES_JSON: ${{ needs.test.outputs.sources }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          new = json.loads(os.environ["SOURCES_JSON"])
          path = Path("skills/SOURCES.json")
          cur = json.loads(path.read_text())
          assert set(new) == set(cur), "unexpected skill names"
          for name, entry in new.items():
              assert re.fullmatch(r"[0-9a-f]{40}", entry["commit"]), name
              cur[name]["commit"] = entry["commit"]
          path.write_text(json.dumps(cur, indent=2) + "\n")
          PY
          python3 scripts/sync_skills.py --pinned
      - name: Commit and check from a clean tree
        env:
          SYNC_LOG: ${{ needs.test.outputs.log }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c sync/skills
          git add skills
          git commit -q -m "Sync skills: $SYNC_LOG"
          git clean -xdfq -- skills
          python3 scripts/sync_skills.py --check
      - name: Push the branch and open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SYNC_LOG: ${{ needs.test.outputs.log }}
          PARTIAL: ${{ needs.test.outputs.partial }}
        run: |
          # sync/skills belongs to this workflow: each run replaces it with a fresh copy of main
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:refs/heads/sync/skills
          files="$(git diff --stat=100 HEAD~1 -- skills | tail -n 40)"
          body="$(printf 'Copied from the skill repos by the Sync skills action.\n\n%s\n\nFiles changed under skills/ (a "restored" line above means files edited by hand in this repo are put back to the upstream version):\n\n```\n%s\n```\n\nBoth skill test suites and the hand-off test (tests/) passed in the sync run on Ubuntu. To run the full CI here (macOS, other Python versions), use "Approve workflows to run" on this pull request, or close and reopen it. Review the diff and merge.' "$SYNC_LOG" "$files")"
          if [ -n "$(gh pr list --head sync/skills --state open --json number --jq '.[].number')" ]; then
            gh pr edit sync/skills --body "$body"
          else
            gh pr create --base main --head sync/skills --title "Sync skills" --body "$body"
          fi
          if [ "$PARTIAL" != "true" ]; then
            for n in $(gh issue list --state open --search 'Sync skills failed in:title' --json number --jq '.[].number'); do
              gh issue close "$n" --comment "The sync works again: pull request on sync/skills."
            done
          fi

  report-failure:
    needs: [test, publish]
    if: failure() || needs.test.outputs.partial == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open an issue when the sync or its tests fail
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$(gh issue list --state open --search 'Sync skills failed in:title' --json number --jq '.[].number')" ]; then
            gh issue create --title "Sync skills failed" \
              --body "The nightly copy of the skills or its tests failed: $RUN. When only one skill failed, the other was still synced in the pull request on sync/skills. Fix the skill in its own repository, then run Sync skills again."
          else
            echo "an issue is already open"
          fi
