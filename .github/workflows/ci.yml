name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: "3.11"}
          - {os: ubuntu-24.04, python: "3.13"}
          - {os: macos-15, python: "3.12"}
          - {os: macos-15, python: "3.14"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
      - name: skills/ equals the upstream skill repos (edit skills there, not here)
        run: python3 scripts/sync_skills.py --check
      - name: Install the design skill's geometry libraries
        run: python3 -m pip install "--only-binary=:all:" -r skills/3d-print-design/requirements.txt
      - name: 3d-print-design tests
        working-directory: skills/3d-print-design
        run: python3 -m unittest discover -s tests -q
      - name: x2d-print tests
        working-directory: skills/x2d-print
        run: python3 -m unittest discover -s tests -q
      - name: Hand-off from design to x2d-print
        run: python3 -m unittest discover -s tests -v

  install:
    # install.sh as a newcomer runs it: fresh home, then a second run must say "ready"
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - name: First run, then a second run that must find everything in place
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          ./install.sh
          test -L "$HOME/.claude/skills/3d-print-design"
          test -L "$HOME/.claude/skills/x2d-print"
          ./install.sh | tee second.log
          grep -q "environment is ready" second.log
      - name: The macOS built-in Python 3.9 is refused with a clear message
        run: |
          export HOME="$RUNNER_TEMP/home2"
          mkdir -p "$HOME"
          if PYTHON=/usr/bin/python3 ./install.sh 2> err.log; then exit 1; fi
          grep -q "3.11 to 3.14" err.log
